<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nuvicon</title>
<link rel="manifest" href="/manifest.webmanifest">
<meta name="theme-color" content="#14191c">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap">
<style>
:root{--bg:#ECEAE4;--card:#fff;--ink:#1d2428;--mut:#667078;--line:#d6d3cb;--acc:#F2B705;--ok:#2f7d4f;--warn:#a85f00;--bad:#b3392f;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#14191c;--card:#1e262b;--ink:#eceae4;--mut:#93a0a8;--line:#323d44;--ok:#5cc38a;--warn:#e0a040;--bad:#f07a6e}}
:root[data-theme="dark"]{--bg:#14191c;--card:#1e262b;--ink:#eceae4;--mut:#93a0a8;--line:#323d44;--ok:#5cc38a;--warn:#e0a040;--bad:#f07a6e}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Archivo,system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:0 14px}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#1d2428 12px 24px)}
.hero{padding:18px 0 12px}
.hero h1{font-size:30px;font-weight:800;letter-spacing:-.02em;margin:0}
.hero p{margin:2px 0 0;color:var(--mut)}
input[type=search]{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit}
input:focus-visible,button:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.chips{display:flex;gap:8px;overflow-x:auto;padding:12px 0}
.chip{flex:none;padding:7px 13px;border:1.5px solid var(--line);border-radius:99px;background:transparent;color:var(--ink);font:600 13px Archivo,system-ui,sans-serif;cursor:pointer}
.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:13px;font-weight:800;margin:18px 0 6px;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px}
.row .i{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{color:var(--mut)}
.st-in{color:var(--ok)}.st-low{color:var(--warn)}.st-out{color:var(--bad)}
.btn{border:0;border-radius:6px;padding:10px 16px;font:800 14px Archivo,system-ui,sans-serif;background:var(--acc);color:#1d2428;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.big{width:100%;padding:14px;font-size:16px}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:6px}
.step button{width:34px;height:34px;border:0;background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.step span{min-width:26px;text-align:center;font-weight:800}
.sum{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:14px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.track{display:flex;margin:12px 0 4px}
.track div{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative;padding-top:16px}
.track div:before{content:"";position:absolute;top:0;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line)}
.track div.d{color:var(--ink);font-weight:600}.track div.d:before{background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;border:0;background:transparent;color:var(--mut);font:600 14px Archivo,system-ui,sans-serif;cursor:pointer}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
.sel{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}.ph{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px}.ph b{font-weight:800}.ph small{color:var(--mut)}.open{font-size:13px;font-weight:600;padding:6px 0}.vrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-bottom:0;padding:10px 12px}.vrow:last-child{border-bottom:1px solid var(--line)}.track div{font-size:10px}.err{color:var(--bad);font-size:13px;margin:6px 0}.note{font-size:12px;color:var(--mut);margin-top:8px}
</style></head>
<body>
<div class="tape"></div>
<main id="app"></main>
<nav id="nav"></nav>
<script>
var U="https://ptbaxvqvwhgowflxzqmh.supabase.co",K="sb_publishable_QeRuu6oa6UKMuPTaIjgLcg_BuX-n2dI";
var sb;
try{sb=window.supabase.createClient(U,K)}catch(e){sb=window.supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false}})}
var STS=["placed","staged","picked_up","in_transit","delivered"],LBL=["Placed","Staged","Picked up","In transit","Delivered"];
var S={prods:[],V:{},zones:[],hours:{},force:false,cart:{},orders:[],user:null,view:"home",q:"",cat:"all",zone:"",addr:"",phone:"",otp:"",step:"phone",err:"",busy:false,loaded:false,next:"cart",loadErr:""};
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}
function fmt(n){return "₹"+Math.round(Number(n)).toLocaleString("en-IN")}
function cap(t){return t.charAt(0).toUpperCase()+t.slice(1)}
function cnt(){var n=0;for(var k in S.cart)n+=S.cart[k];return n}
function sums(){var s=0,g=0;for(var k in S.cart){var x=S.V[k];if(!x)continue;var l=x.v.price*S.cart[k];s+=l;g+=l*x.p.gst_percent/100}return{s:s,g:g,t:s+g}}
function isOpen(){
 if(S.force)return false;
 var d=new Date(new Date().toLocaleString("en-US",{timeZone:"Asia/Kolkata"}));
 var h=S.hours[d.getDay()];if(!h||!h.is_open)return false;
 var m=d.getHours()*60+d.getMinutes(),a=h.opens.split(":"),b=h.closes.split(":");
 return m>=a[0]*60+ +a[1]&&m<b[0]*60+ +b[1]}
function stx(a){return a<1?["Out of stock","st-out"]:a<=5?["Only "+a+" left","st-low"]:a<=20?["Low stock","st-low"]:["In stock","st-in"]}
async function load(){
 try{
  var a=await Promise.all([
   sb.from("products").select("id,brand,name,category,gst_percent,variants(id,label,price,active,inventory(total,reserved))").eq("active",true).order("id"),
   sb.from("zones").select("id,name").eq("active",true).order("id"),
   sb.from("store_hours").select("*"),
   sb.from("settings").select("*").eq("key","force_closed")]);
  for(var i=0;i<a.length;i++)if(a[i].error)throw a[i].error;
  S.prods=a[0].data;S.V={};
  S.prods.forEach(function(p){
   p.variants.sort(function(x,y){return x.id-y.id}).forEach(function(v){
    var inv=Array.isArray(v.inventory)?v.inventory[0]:v.inventory;
    v.avail=inv?inv.total-inv.reserved:0;S.V[v.id]={p:p,v:v}})});
  S.zones=a[1].data;S.hours={};a[2].data.forEach(function(h){S.hours[h.day]=h});
  S.force=!!(a[3].data[0]&&a[3].data[0].value===true);
  S.loaded=true;S.loadErr="";
 }catch(e){S.loadErr=(e&&e.message)||String(e)}
 render()}
async function loadOrders(){
 if(!S.user)return;
 var r=await sb.from("orders").select("id,order_no,total,status,pay_status,created_at,zones(name),order_items(product_name,variant_label,qty)").order("created_at",{ascending:false});
 if(!r.error){S.orders=r.data;if(S.view==="orders")render()}}
function stepper(id,a){var n=S.cart[id]||0;
 if(!n)return '<button class="btn" data-a="inc" data-id="'+id+'">Add</button>';
 return '<div class="step"><button data-a="dec" data-id="'+id+'" aria-label="Remove one">−</button><span>'+n+'</span><button data-a="inc" data-id="'+id+'" aria-label="Add one"'+(n>=a?' disabled':'')+'>+</button></div>'}
function list(){var h="",any=false,s=S.q.toLowerCase();
 S.prods.forEach(function(p){
  if(S.cat!=="all"&&S.cat!==p.category)return;
  var nm=p.brand+" "+p.name;
  var vs=p.variants.filter(function(v){return (nm+" "+v.label).toLowerCase().indexOf(s)>-1});
  if(!vs.length)return;any=true;
  h+='<div class="ph"><b>'+esc(nm)+'</b><small>'+esc(cap(p.category))+', GST '+Number(p.gst_percent)+'%</small></div>'+
  vs.map(function(v){var t=stx(v.avail);
   return '<div class="vrow"><div class="i"><b>'+esc(v.label)+'</b><small>'+fmt(v.price)+' + GST</small><br><small class="'+t[1]+'">'+t[0]+'</small></div>'+
   (v.avail<1?'<button class="btn" disabled>Add</button>':stepper(v.id,v.avail))+'</div>'}).join("")});
 return any?h:'<div class="empty">No materials match “'+esc(S.q)+'”. Try a brand or a category.</div>'}
function home(){
 var o=isOpen(),cats=[];
 S.prods.forEach(function(p){if(cats.indexOf(p.category)<0)cats.push(p.category)});
 return '<div class="hero"><h1>Nuvicon</h1><p>Construction materials from our Nagpur Godown.</p><div class="open" style="color:var(--'+(o?'ok':'bad')+')">'+(o?'Store open':'Currently closed. Orders open 9:00 AM to 8:00 PM, Monday to Saturday.')+'</div></div>'+
 '<input type="search" id="q" placeholder="Search cement, rebar, putty…" value="'+esc(S.q)+'">'+
 '<div class="chips">'+["all"].concat(cats).map(function(c){return '<button class="chip'+(c===S.cat?' on':'')+'" data-a="cat" data-id="'+esc(c)+'">'+esc(cap(c))+'</button>'}).join("")+'</div>'+
 '<div id="list">'+list()+'</div>'}
function cartV(){
 var ids=Object.keys(S.cart).filter(function(k){return S.V[k]});
 if(!ids.length)return '<div class="empty"><p>Your cart is empty.</p><button class="btn" data-a="go" data-id="home">Browse materials</button></div>';
 var m=sums(),o=isOpen();
 return '<div class="hero"><h1>Cart</h1></div>'+ids.map(function(k){var x=S.V[k];
  return '<div class="row"><div class="i"><b>'+esc(x.p.brand+" "+x.p.name)+'</b><small>'+esc(x.v.label)+', '+fmt(x.v.price)+' × '+S.cart[k]+' = '+fmt(x.v.price*S.cart[k])+'</small></div>'+stepper(k,x.v.avail)+'</div>'}).join("")+
 '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>'+fmt(m.s)+'</span></div><div style="display:flex;justify-content:space-between"><span>GST</span><span>'+fmt(m.g)+'</span></div></div>'+
 '<div class="sum"><span>Total</span><span>'+fmt(m.t)+'</span></div>'+
 '<select class="sel" id="zone" aria-label="Delivery zone"><option value="">Select delivery zone</option>'+S.zones.map(function(z){return '<option value="'+z.id+'"'+(String(z.id)===S.zone?' selected':'')+'>'+esc(z.name)+'</option>'}).join("")+'</select>'+
 '<textarea class="sel" id="addr" rows="2" placeholder="Delivery address (site name, landmark)">'+esc(S.addr)+'</textarea>'+
 (S.err?'<div class="err">'+esc(S.err)+'</div>':'')+
 '<button class="btn big" data-a="order"'+(o&&!S.busy?'':' disabled')+'>'+(!o?'Store is closed':S.busy?'Placing order…':S.user?'Place order':'Log in to place order')+'</button>'+
 '<p class="note">Payment is on delivery for now. The Godown adds the delivery fee when it confirms your order. Prices are sample prices.</p>'}
function loginV(){
 return '<div class="hero"><h1>Log in</h1><p>We will send a code to your phone.</p></div>'+
 (S.step==="phone"?
 '<input class="sel" id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" value="'+esc(S.phone)+'">'+
 '<button class="btn big" data-a="sendotp"'+(S.busy?' disabled':'')+'>'+(S.busy?'Sending…':'Send code')+'</button>':
 '<p class="note">Code sent to +91 '+esc(S.phone)+'.</p><input class="sel" id="otp" type="tel" inputmode="numeric" maxlength="6" placeholder="6-digit code" value="'+esc(S.otp)+'">'+
 '<button class="btn big" data-a="verify"'+(S.busy?' disabled':'')+'>'+(S.busy?'Checking…':'Verify and continue')+'</button><button class="btn ghost big" style="margin-top:8px" data-a="changephone">Change number</button>')+
 (S.err?'<div class="err">'+esc(S.err)+'</div>':'')}
function ordersV(){
 var h='<div class="hero"><h1>Orders</h1></div>';
 if(!S.orders.length)h+='<div class="empty"><p>No orders yet.</p><button class="btn" data-a="go" data-id="home">Browse materials</button></div>';
 h+=S.orders.map(function(o){var i=STS.indexOf(o.status);
  return '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b>Order #'+esc(o.order_no)+'</b><b>'+fmt(o.total)+'</b></div>'+
  '<small>'+new Date(o.created_at).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})+', '+esc(o.zones&&o.zones.name)+', payment '+esc(o.pay_status)+'</small><br><small>'+o.order_items.map(function(l){return l.qty+' × '+esc(l.product_name)+' ('+esc(l.variant_label)+')'}).join(", ")+'</small>'+
  (o.status==="cancelled"?'<div class="err">Cancelled</div>':'<div class="track">'+LBL.map(function(s,j){return '<div class="'+(j<=i?'d':'')+'">'+s+'</div>'}).join("")+'</div>')+'</div>'}).join("");
 return h+'<button class="btn ghost" style="margin-top:10px" data-a="logout">Log out</button>'}
function nav(){
 var t=[["home","Home"],["cart","Cart"+(cnt()?" ("+cnt()+")":"")],["orders","Orders"]];
 document.getElementById("nav").innerHTML=t.map(function(x){return '<button class="'+(S.view===x[0]?'on':'')+'" data-a="go" data-id="'+x[0]+'">'+x[1]+'</button>'}).join("")}
function render(){
 var h;
 if(!S.loaded)h='<div class="empty">'+(S.loadErr?'<p>Could not load the catalog.</p><p class="note">'+esc(S.loadErr)+'</p><button class="btn" data-a="retry">Try again</button>':'Loading materials…')+'</div>';
 else h=S.view==="home"?home():S.view==="cart"?cartV():S.view==="login"?loginV():ordersV();
 document.getElementById("app").innerHTML=h;nav()}
document.addEventListener("click",async function(e){
 var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
 var a=b.dataset.a,id=b.dataset.id,y=window.scrollY;
 S.err="";
 if(a==="go"){
  if(id==="orders"&&!S.user){S.next="orders";S.view="login"}
  else{S.view=id;if(id==="orders")loadOrders()}}
 else if(a==="cat")S.cat=id;
 else if(a==="inc"){var x=S.V[id];if((S.cart[id]||0)<x.v.avail)S.cart[id]=(S.cart[id]||0)+1}
 else if(a==="dec"){S.cart[id]=(S.cart[id]||0)-1;if(S.cart[id]<1)delete S.cart[id]}
 else if(a==="retry"){S.loadErr="";render();return load()}
 else if(a==="changephone"){S.step="phone";S.otp=""}
 else if(a==="logout"){await sb.auth.signOut();S.user=null;S.orders=[];S.view="home"}
 else if(a==="sendotp"){
  if(!/^[6-9][0-9]{9}$/.test(S.phone)){S.err="Enter a valid 10-digit mobile number."}
  else{S.busy=true;render();
   var r=await sb.auth.signInWithOtp({phone:"+91"+S.phone});
   S.busy=false;if(r.error)S.err=r.error.message;else S.step="otp"}}
 else if(a==="verify"){
  S.busy=true;render();
  var r2=await sb.auth.verifyOtp({phone:"+91"+S.phone,token:S.otp,type:"sms"});
  S.busy=false;
  if(r2.error)S.err=r2.error.message;
  else{S.user=r2.data.user;S.step="phone";S.otp="";S.view=S.next;if(S.view==="orders")loadOrders()}}
 else if(a==="order"){
  if(!S.user){S.next="cart";S.view="login"}
  else if(!S.zone){S.err="Select a delivery zone first."}
  else{
   S.busy=true;render();
   var items=Object.keys(S.cart).map(function(k){return{variant_id:+k,qty:S.cart[k]}});
   var r3=await sb.rpc("place_order",{p_zone:+S.zone,p_pay:"on_delivery",p_address:S.addr,p_items:items});
   S.busy=false;
   if(r3.error){S.err=r3.error.message;load()}
   else{S.cart={};S.addr="";S.view="orders";await loadOrders();load()}}}
 render();window.scrollTo(0,y)});
document.addEventListener("input",function(e){
 var i=e.target.id;
 if(i==="q"){S.q=e.target.value;document.getElementById("list").innerHTML=list()}
 else if(i==="phone")S.phone=e.target.value.replace(/\D/g,"");
 else if(i==="otp")S.otp=e.target.value.replace(/\D/g,"");
 else if(i==="addr")S.addr=e.target.value});
document.addEventListener("change",function(e){if(e.target.id==="zone")S.zone=e.target.value});
sb.auth.onAuthStateChange(function(ev,s){S.user=s?s.user:null});
sb.auth.getSession().then(function(r){if(r.data&&r.data.session)S.user=r.data.session.user});
setInterval(function(){if(S.view==="orders"&&S.user)loadOrders()},20000);
render();load();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})</script>
</body></html>
