<style>

*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.45 Archivo,system-ui,sans-serif;padding-bottom:84px}
main{max-width:560px;margin:0 auto;padding:0 14px}
.tape{height:10px;background:repeating-linear-gradient(-45deg,var(--acc) 0 12px,#1d2428 12px 24px)}

.chip.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:13px;font-weight:800;margin:18px 0 6px;color:var(--mut)}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:12px;margin-bottom:8px}
.row .i{flex:1;min-width:0}
.row b{display:block;font-weight:600}
.row small{color:var(--mut)}
.st-in{color:var(--ok)}.st-low{color:var(--warn)}.st-out{color:var(--bad)}
.btn{border:0;border-radius:6px;padding:10px 16px;font:800 14px Archivo,system-ui,sans-serif;background:var(--acc);color:#1d2428;cursor:pointer}
.btn:disabled{opacity:.4;cursor:not-allowed}
.btn.ghost{background:transparent;border:1.5px solid var(--line);color:var(--ink)}
.btn.big{width:100%;padding:14px;font-size:16px}
.step{display:flex;align-items:center;border:1.5px solid var(--line);border-radius:6px}
.step button{width:34px;height:34px;border:0;background:transparent;color:var(--ink);font-size:18px;cursor:pointer}
.step span{min-width:26px;text-align:center;font-weight:800}
.sum{display:flex;justify-content:space-between;font-size:18px;font-weight:800;padding:14px 0}
.empty{text-align:center;color:var(--mut);padding:40px 10px}
.track{display:flex;margin:12px 0 4px}
.track div{flex:1;text-align:center;font-size:11px;color:var(--mut);position:relative;padding-top:16px}
.track div:before{content:"";position:absolute;top:0;left:50%;width:12px;height:12px;margin-left:-6px;border-radius:50%;background:var(--line)}
.track div.d{color:var(--ink);font-weight:600}.track div.d:before{background:var(--ok)}
nav{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;padding-bottom:env(safe-area-inset-bottom,0px)}
nav button{flex:1;padding:14px 0;border:0;background:transparent;color:var(--mut);font:600 14px Archivo,system-ui,sans-serif;cursor:pointer}
nav button.on{color:var(--ink);box-shadow:inset 0 3px 0 var(--acc)}
.sel{width:100%;padding:11px;border:1.5px solid var(--line);border-radius:6px;background:var(--card);color:var(--ink);font:inherit;margin-bottom:8px}.ph{display:flex;justify-content:space-between;align-items:baseline;margin:16px 0 6px}.ph b{font-weight:800}.ph small{color:var(--mut)}.open{font-size:13px;font-weight:600;padding:6px 0}.vrow{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-bottom:0;padding:10px 12px}.vrow:last-child{border-bottom:1px solid var(--line)}.track div{font-size:10px}.err{color:var(--bad);font-size:13px;margin:6px 0}.note{font-size:12px;color:var(--mut);margin-top:8px}
</style></head>

<script>

var S={cr:null,onl:false,rzk:"",pay:"cod",prods:[],V:{},zones:[],hours:{},force:false,city:"Pusad",gm:{key:"",godown:null,radius:0},loc:null,area:"",areaEdited:false,locBusy:false,cart:{},orders:[],user:null,view:"home",q:"",cat:"all",zone:"",addr:"",phone:"",otp:"",step:"phone",err:"",busy:false,loaded:false,next:"cart",loadErr:""};
function esc(t){return String(t==null?"":t).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/"/g,"&quot;")}

  S.prods=a[0].data;S.V={};

   p.variants.sort(function(x,y){return x.id-y.id}).forEach(function(v){
    var inv=Array.isArray(v.inventory)?v.inventory[0]:v.inventory;
    v.avail=inv?inv.total-inv.reserved:0;S.V[v.id]={p:p,v:v}})});

  S.loaded=true;S.loadErr="";
 }catch(e){S.loadErr=(e&&e.message)||String(e)}
 render()}
async function loadOrders(){
 if(!S.user)return;
 var r=await sb.from("orders").select("id,order_no,total,status,pay_status,pay_method,created_at,zones(name),area_text,distance_km,order_items(product_name,variant_label,qty)").order("created_at",{ascending:false});

 if(!cr.error)S.cr=(cr.data&&cr.data.enabled)?cr.data:null;
 if(!r.error){S.orders=r.data;if(S.view==="orders"||S.view==="cart")render()}}

var MP={};
function geoMode(){return !!(S.gm.key&&S.gm.godown)}
function hav(a,b,c,d){var R=6371,r=Math.PI/180,x=(c-a)*r,y=(d-b)*r,q=Math.sin(x/2)*Math.sin(x/2)+Math.cos(a*r)*Math.cos(c*r)*Math.sin(y/2)*Math.sin(y/2);return 2*R*Math.asin(Math.sqrt(q))}
var gmP=null;
function loadMaps(){
 if(window.google&&google.maps&&google.maps.Map)return Promise.resolve();
 if(gmP)return gmP;
 gmP=new Promise(function(res,rej){window.__gmReady=res;var t=document.createElement("script");t.src="https://maps.googleapis.com/maps/api/js?key="+encodeURIComponent(S.gm.key)+"&callback=__gmReady&v=weekly";t.onerror=function(){gmP=null;rej(new Error("Could not load the map"))};document.head.appendChild(t)});
 return gmP}
async function roadKm(a,b){
 try{var r=await fetch("https://routes.googleapis.com/directions/v2:computeRoutes",{method:"POST",headers:{"Content-Type":"application/json","X-Goog-Api-Key":S.gm.key,"X-Goog-FieldMask":"routes.distanceMeters"},body:JSON.stringify({origin:{location:{latLng:{latitude:a.lat,longitude:a.lng}}},destination:{location:{latLng:{latitude:b.lat,longitude:b.lng}}},travelMode:"DRIVE"})});
  var j=await r.json();if(j.routes&&j.routes[0]&&j.routes[0].distanceMeters)return j.routes[0].distanceMeters/1000}catch(e){}
 return null}
async function revGeo(lat,lng){
 try{await loadMaps();var r=await new google.maps.Geocoder().geocode({location:{lat:lat,lng:lng}});var x=r.results&&r.results[0];
  if(x){var area="";
   x.address_components.forEach(function(c){if(!area&&(c.types.indexOf("sublocality_level_1")>-1||c.types.indexOf("sublocality")>-1||c.types.indexOf("neighborhood")>-1))area=c.long_name});
   if(!area)x.address_components.forEach(function(c){if(!area&&c.types.indexOf("locality")>-1)area=c.long_name});
   return {text:x.formatted_address,area:area}}}catch(e){}
 return {text:"Pin ki location ("+lat.toFixed(5)+", "+lng.toFixed(5)+")",area:""}}
async function setLoc(lat,lng){
 S.locBusy=true;S.err="";render();
 var g=await revGeo(lat,lng),gd=S.gm.godown,st=hav(lat,lng,gd.lat,gd.lng);
 var rk=await roadKm({lat:gd.lat,lng:gd.lng},{lat:lat,lng:lng});
 var km=(rk!=null&&rk>=st*0.95)?rk:st*1.3;
 S.loc={lat:lat,lng:lng,text:g.text,km:Math.round(km*10)/10};
 if(!S.areaEdited)S.area=g.area||S.area;
 S.locBusy=false;render()}
function locBlock(){
 var l=S.loc,rad=S.gm.radius,far=l&&rad&&l.km>rad;
 return '<div class="row" style="display:block"><b>Delivery location</b>'+
 (l?'<br><small>'+esc(l.text)+'</small><br><b>About '+l.km+' km from our godown</b>'+(far?'<div class="err">We deliver up to '+rad+' km only.</div>':''):'<br><small>Use your current location or pick a point on the map.</small>')+
 (S.locBusy?'<br><small>Location dekh raha hoon…</small>':'')+
 '<div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost" style="flex:1" data-a="mylocation">My location</button><button class="btn" style="flex:1" data-a="openmap">Pick on map</button></div>'+
 '<input class="sel" id="area" placeholder="Area / mohalla" value="'+esc(S.area)+'" style="margin-top:8px"></div>'}
async function openMap(){
 try{await loadMaps()}catch(e){S.err=e.message;render();return}
 var gd=S.gm.godown,c=S.loc?{lat:S.loc.lat,lng:S.loc.lng}:{lat:gd.lat,lng:gd.lng};
 var o=document.getElementById("mapov");if(!o){o=document.createElement("div");o.id="mapov";document.body.appendChild(o)}
 o.style.cssText="position:fixed;left:0;top:0;right:0;bottom:0;background:#fff;z-index:50;display:flex;flex-direction:column";
 o.innerHTML='<div style="padding:10px;display:flex;gap:8px"><input id="msq" placeholder="Search area or address" style="flex:1;padding:10px;border:1.5px solid #d6d3cb;border-radius:6px;font:inherit"><button class="btn" data-a="mapsearch">Search</button></div><div id="mapc" style="flex:1"></div><div style="padding:10px"><small id="mapt">Drag the pin or tap on the map</small><div style="display:flex;gap:8px;margin-top:8px"><button class="btn ghost" data-a="mapx" style="flex:1">Back</button><button class="btn" data-a="mapok" style="flex:2">Deliver here</button></div></div>';
 MP.map=new google.maps.Map(document.getElementById("mapc"),{center:c,zoom:16,streetViewControl:false,mapTypeControl:false,fullscreenControl:false});
 MP.mk=new google.maps.Marker({position:c,map:MP.map,draggable:true});MP.pos=c;
 var mv=function(p){MP.pos={lat:p.lat(),lng:p.lng()};MP.mk.setPosition(p);revGeo(MP.pos.lat,MP.pos.lng).then(function(g){var t=document.getElementById("mapt");if(t)t.textContent=g.text})};

function closeMap(){var o=document.getElementById("mapov");if(o)o.remove()}

 S.prods.forEach(function(p){

  var nm=p.brand+" "+p.name;

  vs.map(function(v){var t=stx(v.avail);

 return any?h:'<div class="empty">No materials match “'+esc(S.q)+'”. Try a brand or a category.</div>'}
function home(){
 var o=isOpen(),cats=[];
 S.prods.forEach(function(p){if(cats.indexOf(p.category)<0)cats.push(p.category)});
 return '<div class="hero"><h1>Nuvicon</h1><p>Construction materials from our '+esc(S.city)+' Godown.</p><div class="open" style="color:var(--'+(o?'ok':'bad')+')">'+(o?'Store open':'Currently closed. Orders open 9:00 AM to 8:00 PM, Monday to Saturday.')+'</div></div>'+

 '<div id="list">'+list()+'</div>'}
function cartV(){
 var ids=Object.keys(S.cart).filter(function(k){return S.V[k]});
 if(!ids.length)return '<div class="empty"><p>Your cart is empty.</p><button class="btn" data-a="go" data-id="home">Browse materials</button></div>';
 var m=sums(),o=isOpen();
 return '<div class="hero"><h1>Cart</h1></div>'+ids.map(function(k){var x=S.V[k];
  return '<div class="row"><div class="i"><b>'+esc(x.p.brand+" "+x.p.name)+'</b><small>'+esc(x.v.label)+', '+fmt(x.v.price)+' × '+S.cart[k]+' = '+fmt(x.v.price*S.cart[k])+'</small></div>'+stepper(k,x.v.avail)+'</div>'}).join("")+
 '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><span>Subtotal</span><span>'+fmt(m.s)+'</span></div><div style="display:flex;justify-content:space-between"><span>GST</span><span>'+fmt(m.g)+'</span></div></div>'+
 '<div class="sum"><span>Total</span><span>'+fmt(m.t)+'</span></div>'+
 (geoMode()?locBlock():'<select class="sel" id="zone" aria-label="Delivery zone"><option value="">Select delivery zone</option>'+S.zones.map(function(z){return '<option value="'+z.id+'"'+(String(z.id)===S.zone?' selected':'')+'>'+esc(z.name)+'</option>'}).join("")+'</select>')+
 '<textarea class="sel" id="addr" rows="2" placeholder="Delivery address (site name, landmark)">'+esc(S.addr)+'</textarea>'+
 payOpt()+(S.err?'<div class="err">'+esc(S.err)+'</div>':'')+
 '<button class="btn big" data-a="order"'+(o&&!S.busy?'':' disabled')+'>'+(!o?'Store is closed':S.busy?'Placing order…':S.user?(payM()==="online"?'Pay online':'Place order'):'Log in to place order')+'</button>'+
 '<p class="note">'+(S.onl&&S.rzk?'Pay online now or in cash on delivery. ':S.cr?'':'Payment is on delivery. ')+'Delivery charges may be added when your order is confirmed.</p>'}
function payM(){return S.pay==="credit"&&S.cr?"credit":S.onl&&S.rzk&&S.pay==="online"?"online":"on_delivery"}

 var onl=S.onl&&S.rzk;
 if(!onl&&!S.cr)return '';
 var tot=sums().t,okc=S.cr&&tot<=Number(S.cr.available);
 var crOpt=S.cr?'<label style="display:block;padding:6px 0;'+(okc?'':'opacity:.55')+'"><input type="radio" name="pay" data-a="payopt" data-id="credit"'+(S.pay==="credit"?' checked':'')+(okc?'':' disabled')+' style="width:auto"> Credit <small>Available limit '+fmt(S.cr.available)+(okc?'':' (not enough for this order)')+'</small></label>':'';
 var onOpt=onl?'<label style="display:block;padding:6px 0"><input type="radio" name="pay" data-a="payopt" data-id="online"'+(S.pay==="online"?' checked':'')+' style="width:auto"> Pay online (UPI / card / netbanking)</label>':'';

var rzS=null;

 if(window.Razorpay)return Promise.resolve();
 if(rzS)return rzS;
 rzS=new Promise(function(res,rej){var sc=document.createElement("script");sc.src="https://checkout.razorpay.com/v1/checkout.js";sc.onload=res;sc.onerror=function(){rzS=null;rej(new Error("Could not load the payment page. Check your internet."))};document.head.appendChild(sc)});

async function fnErr(r){
 try{if(r.data&&r.data.error)return r.data.error;
  if(r.error&&r.error.context&&r.error.context.text){var t=await r.error.context.text();try{var j=JSON.parse(t);return (j.error||j.message||j.msg||t)+" (code "+r.error.context.status+")"}catch(e){return t+" (code "+r.error.context.status+")"}}
  if(r.error)return r.error.message}catch(e){}

async function payOrder(oid){
 try{
  await loadRzp();
  var c=await sb.functions.invoke("rapid-function",{body:{action:"create",order:oid}});
  if(c.error||!c.data||c.data.error)throw new Error((await fnErr(c))||"Could not start the payment");
  var d=c.data;
  await new Promise(function(res){
   var done=false;
   var rz=new Razorpay({key:d.key_id,amount:d.amount,currency:"INR",order_id:d.rzp_order_id,name:"Nuvicon",description:"Order #"+d.order_no,
    prefill:{contact:S.user&&S.user.phone?"+"+String(S.user.phone).replace(/^\+/,""):""},theme:{color:"#14191c"},
    handler:async function(r){done=true;
     var v=await sb.functions.invoke("rapid-function",{body:{action:"verify",order:oid,payment_id:r.razorpay_payment_id,signature:r.razorpay_signature}});
     if(v.error||!v.data||v.data.error)S.err="Payment done but not confirmed yet ("+((await fnErr(v))||"unknown")+"). Check Orders in a moment. If money was deducted, we will confirm your order.";
     res()},
    modal:{ondismiss:function(){if(!done)res()}}});

 '<input class="sel" id="phone" type="tel" inputmode="numeric" maxlength="10" placeholder="10-digit mobile number" value="'+esc(S.phone)+'">'+
 '<button class="btn big" data-a="sendotp"'+(S.busy?' disabled':'')+'>'+(S.busy?'Sending…':'Send code')+'</button>':
 '<p class="note">Code sent to +91 '+esc(S.phone)+'.</p><input class="sel" id="otp" type="tel" inputmode="numeric" maxlength="6" placeholder="6-digit code" value="'+esc(S.otp)+'">'+
 '<button class="btn big" data-a="verify"'+(S.busy?' disabled':'')+'>'+(S.busy?'Checking…':'Verify and continue')+'</button><button class="btn ghost big" style="margin-top:8px" data-a="changephone">Change number</button>')+
 (S.err?'<div class="err">'+esc(S.err)+'</div>':'')}
function ordersV(){
 var h='<div class="hero"><h1>Orders</h1></div>'+(S.err?'<div class="err">'+esc(S.err)+'</div>':'')+(S.cr?'<div class="row" style="display:block"><b>Credit account</b><br><small>Limit '+fmt(S.cr.limit)+', outstanding '+fmt(S.cr.used)+', available '+fmt(S.cr.available)+'</small></div>':'');
 if(!S.orders.length)h+='<div class="empty"><p>No orders yet.</p><button class="btn" data-a="go" data-id="home">Browse materials</button></div>';
 h+=S.orders.map(function(o){var i=STS.indexOf(o.status);
  return '<div class="row" style="display:block"><div style="display:flex;justify-content:space-between"><b>Order #'+esc(o.order_no)+'</b><b>'+fmt(o.total)+'</b></div>'+
  '<small>'+new Date(o.created_at).toLocaleDateString("en-IN",{day:"numeric",month:"short",year:"numeric"})+', '+esc((o.zones&&o.zones.name)||o.area_text||"")+(o.distance_km!=null?', '+o.distance_km+' km':'')+', payment '+(o.pay_method==="online"?'online, ':o.pay_method==="credit"?'credit, ':'cash on delivery, ')+esc(o.pay_status)+'</small><br><small>'+o.order_items.map(function(l){return l.qty+' × '+esc(l.product_name)+' ('+esc(l.variant_label)+')'}).join(", ")+'</small>'+
  (o.status==="placed"&&o.pay_method==="online"&&o.pay_status==="pending"?'<div style="margin-top:8px;display:flex;gap:8px"><button class="btn" data-a="paynow" data-id="'+o.id+'"'+(S.busy?' disabled':'')+'>Pay now</button><button class="btn ghost" data-a="cxl" data-id="'+o.id+'">Cancel</button></div>':'')+''+(o.status==="cancelled"?'<div class="err">Cancelled</div>':'<div class="track">'+LBL.map(function(s,j){return '<div class="'+(j<=i?'d':'')+'">'+s+'</div>'}).join("")+'</div>')+'</div>'}).join("");
 return h+'<button class="btn ghost" style="margin-top:10px" data-a="logout">Log out</button>'}
function nav(){
 var t=[["home","Home"],["cart","Cart"+(cnt()?" ("+cnt()+")":"")],["orders","Orders"]];
 document.getElementById("nav").innerHTML=t.map(function(x){return '<button class="'+(S.view===x[0]?'on':'')+'" data-a="go" data-id="'+x[0]+'">'+x[1]+'</button>'}).join("")}
function render(){
 var h;
 if(!S.loaded)h='<div class="empty">'+(S.loadErr?'<p>Could not load the catalog.</p><p class="note">'+esc(S.loadErr)+'</p><button class="btn" data-a="retry">Try again</button>':'Loading materials…')+'</div>';
 else h=S.view==="home"?home():S.view==="cart"?cartV():S.view==="login"?loginV():ordersV();
 document.getElementById("app").innerHTML=h;nav()}
document.addEventListener("click",async function(e){
 var b=e.target.closest("[data-a]");if(!b||b.disabled)return;
 var a=b.dataset.a,id=b.dataset.id,y=window.scrollY;
 S.err="";
 if(a==="go"){
  if(id==="orders"&&!S.user){S.next="orders";S.view="login"}
  else{S.view=id;if(id==="orders"||id==="cart")loadOrders()}}
 else if(a==="cat")S.cat=id;
 else if(a==="inc"){var x=S.V[id];if((S.cart[id]||0)<x.v.avail)S.cart[id]=(S.cart[id]||0)+1}
 else if(a==="dec"){S.cart[id]=(S.cart[id]||0)-1;if(S.cart[id]<1)delete S.cart[id]}
 else if(a==="mylocation"){
  if(!navigator.geolocation){S.err="Location is not available on this phone. Pick a point on the map."}
  else{navigator.geolocation.getCurrentPosition(function(p){setLoc(p.coords.latitude,p.coords.longitude)},function(){S.err="Could not get your location. Allow permission or pick a point on the map.";render()},{enableHighAccuracy:true,timeout:15000});S.err=""}}
 else if(a==="openmap"){await openMap();return}
 else if(a==="mapsearch"){
  var q9=(document.getElementById("msq").value||"").trim();
  if(q9){try{var gr=await new google.maps.Geocoder().geocode({address:q9+", "+S.city});var lo=gr.results&&gr.results[0]&&gr.results[0].geometry.location;if(lo){MP.map.setCenter(lo);MP.map.setZoom(16);MP.mv(lo)}else{document.getElementById("mapt").textContent="Place not found"}}catch(e){document.getElementById("mapt").textContent="Search failed"}}
  return}
 else if(a==="mapx"){closeMap();return}
 else if(a==="mapok"){closeMap();setLoc(MP.pos.lat,MP.pos.lng);return}
 else if(a==="retry"){S.loadErr="";render();return load()}
 else if(a==="changephone"){S.step="phone";S.otp=""}
 else if(a==="logout"){await sb.auth.signOut();S.user=null;S.cr=null;S.orders=[];S.view="home"}
 else if(a==="sendotp"){
  if(!/^[6-9][0-9]{9}$/.test(S.phone)){S.err="Enter a valid 10-digit mobile number."}
  else{S.busy=true;render();
   var r=await sb.auth.signInWithOtp({phone:"+91"+S.phone});
   S.busy=false;if(r.error)S.err=r.error.message;else S.step="otp"}}
 else if(a==="verify"){
  S.busy=true;render();
  var r2=await sb.auth.verifyOtp({phone:"+91"+S.phone,token:S.otp,type:"sms"});
  S.busy=false;
  if(r2.error)S.err=r2.error.message;
  else{S.user=r2.data.user;S.step="phone";S.otp="";S.view=S.next;loadOrders()}}
 else if(a==="order"){
  if(!S.user){S.next="cart";S.view="login"}
  else if(geoMode()&&!S.loc){S.err="Please choose a delivery location first."}
  else if(geoMode()&&S.gm.radius&&S.loc.km>S.gm.radius){S.err="Hum "+S.gm.radius+" km tak hi deliver karte hain."}
  else if(!geoMode()&&!S.zone){S.err="Select a delivery zone first."}
  else{
   S.busy=true;render();
   var items=Object.keys(S.cart).map(function(k){return{variant_id:+k,qty:S.cart[k]}});
   var args=geoMode()?{p_zone:null,p_pay:payM(),p_address:S.addr,p_items:items,p_area:S.area||"",p_lat:S.loc.lat,p_lng:S.loc.lng,p_road_km:S.loc.km}:{p_zone:+S.zone,p_pay:payM(),p_address:S.addr,p_items:items};
   var r3=await sb.rpc("place_order",args);
   S.busy=false;
   if(r3.error){S.err=r3.error.message;load()}
   else{var onl=payM()==="online";S.cart={};S.addr="";S.loc=null;S.area="";S.areaEdited=false;S.view="orders";S.err="";await loadOrders();load();if(onl){S.busy=true;render();await payOrder(r3.data);S.busy=false}}}}
 else if(a==="payopt"){S.pay=id}
 else if(a==="paynow"){S.err="";S.busy=true;render();await payOrder(+id);S.busy=false}
 else if(a==="cxl"){if(!confirm("Cancel this order?"))return;var rc=await sb.rpc("cancel_my_unpaid",{p_order:+id});if(rc.error)S.err=rc.error.message;else{S.err=""}await loadOrders();load()}
 render();window.scrollTo(0,y)});
document.addEventListener("input",function(e){
 var i=e.target.id;
 if(i==="q"){S.q=e.target.value;document.getElementById("list").innerHTML=list()}
 else if(i==="phone")S.phone=e.target.value.replace(/\D/g,"");
 else if(i==="otp")S.otp=e.target.value.replace(/\D/g,"");
 else if(i==="addr")S.addr=e.target.value
 else if(i==="area"){S.area=e.target.value;S.areaEdited=true}});
document.addEventListener("change",function(e){if(e.target.id==="zone")S.zone=e.target.value});
sb.auth.onAuthStateChange(function(ev,s){S.user=s?s.user:null});
sb.auth.getSession().then(function(r){if(r.data&&r.data.session){S.user=r.data.session.user;loadOrders()}});
setInterval(function(){if(S.view==="orders"&&S.user)loadOrders()},20000);
render();load();
</script>
<script>if('serviceWorker' in navigator)window.addEventListener('load',function(){navigator.serviceWorker.register('/sw.js').catch(function(){})})</script>
