function normT(s){return String(s).toLowerCase().replace(/(\d)\s*(kg|mm|ml|ltr|litre|liter|l|m)(?![a-z])/g,function(m,n,u){return n+(/^(ltr|litre|liter)$/.test(u)?"l":u)}).replace(/(\d)\s*x\s*(?=\d)/g,"$1x")}
function reEsc(t){return t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")}
function hasTok(l,t){return new RegExp("(^|[^a-z0-9.])"+reEsc(t)+"($|[^a-z0-9])").test(l)}
function vKeys(v){
 var pt=(v.products.brand+" "+v.products.name).toLowerCase().replace(/[^a-z0-9 ]/g," ").split(/\s+/).filter(function(w){return w&&["bar","premium","plus"].indexOf(w)<0});
 var sz=normT(v.label.replace(/,/g," ")).split(/[^a-z0-9.x]+/).filter(function(w){return /\d/.test(w)});

function parseLines(lines,inv){
 var out=[],dm=lines.map(function(x){return typeof x==="string"?x:""}).join("\n").match(/discount\s*@?\s*(\d+(?:\.\d+)?)\s*%/i),disc=dm?parseFloat(dm[1]):0;
 lines.forEach(function(raw){
  var l=normT(raw.replace(/\s+/g," ").trim());if(l.length<4)return;
  /* steel bill line: size in mm, bundles*pieces, weight in M.T., amount */
  var s1=l.match(/\b(\d{1,2})mm\b/),s2=l.match(/(\d{1,3})\s*[*x×]\s*(\d{1,3})(?!\d)/),s3=l.match(/(\d{1,2}\.\d{3})\s*m/);
  if(s1&&s2&&s3&&/bar|tmt|rod/.test(l)){
   var mm=parseInt(s1[1],10),pcs=parseInt(s2[1],10)*parseInt(s2[2],10),kgw=parseFloat(s3[1])*1000,am=(l.match(/\d{1,3}(?:,\d{2,3})+\.\d{2}|\d{4,}\.\d{2}/g)||[]).map(function(x){return parseFloat(x.replace(/,/g,""))}),amt=am.length?am[am.length-1]:0;
   var cands=inv.filter(function(v){var m=normT(v.label).match(/(\d{1,2})mm/);return v.fee_basis==="weight"&&m&&parseInt(m[1],10)===mm}),bv=null,bsc=-1;
   cands.forEach(function(v){var sc=vKeys(v).pt.filter(function(w){return hasTok(l,w)}).length;if(sc>bsc){bsc=sc;bv=v}});
   var cg=(amt>0&&kgw>0)?amt/kgw:0;if(!(cg>20&&cg<200))cg=0;
   out.push({v:(bv&&bsc>0)?String(bv.id):"",q:String(pcs),c:cg?Math.round(cg*(1-disc/100)*100)/100:0,raw:raw.replace(/\s+/g," ").trim()});return}
  var best=null,bs=0;
  inv.forEach(function(v){
   var k=vKeys(v),pm=k.pt.filter(function(w){return hasTok(l,w)}).length,sm=k.sz.filter(function(w){return hasTok(l,w)}).length;
   if(!k.pt.length||pm/k.pt.length<0.5)return;
   if(k.sz.length&&!sm)return;
   var sc=pm+sm*2-(k.sz.length-sm)*0.5;
   if(sc>bs){bs=sc;best=v}});

  var nums=(rest.match(/\d[\d,]*(\.\d+)?/g)||[]).map(function(x){return x.replace(/,/g,"")}).filter(function(x){return !/^\d{4,8}$/.test(x)});

async function pdfLines(f){
 if(!window.pdfjsLib)await loadScript("https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js");
 pdfjsLib.GlobalWorkerOptions.workerSrc="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";
 var pdf=await pdfjsLib.getDocument({data:await f.arrayBuffer()}).promise,lines=[];
 for(var p=1;p<=pdf.numPages;p++){
  var tc=await (await pdf.getPage(p)).getTextContent();
  var it=tc.items.filter(function(i){return i.str&&i.str.trim()}).map(function(i){return {y:i.transform[5],x:i.transform[4],s:i.str}}).sort(function(a,b){return b.y-a.y||a.x-b.x});
  var cur=null;
  it.forEach(function(i){if(cur&&Math.abs(cur.y-i.y)<=3){cur.p.push(i)}else{cur={y:i.y,p:[i]};lines.push(cur)}});
  lines=lines.map(function(l){return l.p?l.p.sort(function(a,b){return a.x-b.x}).map(function(i){return i.s}).join(" "):l})}
 return lines}

 }catch(x){b.err="Error: "+x.message}
 b.busy=false;b.done=true;render()}

 else if(i==="q"){S.q=e.target.value;var pos=e.target.selectionStart;render();var el=document.getElementById("q");if(el){el.focus();el.setSelectionRange(pos,pos)}}
 else if(e.target.dataset.bulk){S.bulk.vals[e.target.dataset.bulk]=e.target.value}
 else if(e.target.dataset.bi!=null&&e.target.dataset.f==="q"){S.bill.rows[+e.target.dataset.bi].q=e.target.value}
 else if(e.target.dataset.zf){S.zonef=e.target.value}
 else if(e.target.dataset.nf){S.nf[e.target.dataset.nf]=e.target.value;if(e.target.dataset.nf==="kg")S.nf.kt=true}
 else if(e.target.dataset.ef){S.ef[e.target.dataset.ef]=e.target.value}
 else if(e.target.dataset.cf){var cv=e.target.value;if(e.target.dataset.cf==="phone")cv=cv.replace(/\D/g,"");S.cf[e.target.dataset.cf]=cv}
 else if(e.target.dataset.pf){var pv=e.target.value;if(e.target.dataset.pf==="phone")pv=pv.replace(/\D/g,"");S.pf[e.target.dataset.pf]=pv}
 else if(e.target.dataset.sf){var sv=e.target.value;if(e.target.dataset.sf==="phone")sv=sv.replace(/\D/g,"");S.sf[e.target.dataset.sf]=sv}
 else if(e.target.dataset.af==="q"){S.af.q=e.target.value;var ps=e.target.selectionStart;render();var ea=document.getElementById("aq");if(ea){ea.focus();ea.setSelectionRange(ps,ps)}}});
document.addEventListener("change",function(e){var t=e.target;
 if(t.dataset&&t.dataset.nf==="basis"){S.nf.basis=t.value;S.nf.bt=true;nfAuto();render();return}
 if(t.dataset&&(t.dataset.nf==="cat"||t.dataset.nf==="name"||t.dataset.nf==="label"||t.dataset.nf==="brand")){S.nf[t.dataset.nf]=t.value;nfAuto();render();return}
 if(t.id==="billcost"){S.bill.cost=t.checked;return}
 if(t.id==="billfile"&&t.files&&t.files[0])processBill(t.files[0]);
 else if(t.dataset&&t.dataset.bi!=null&&t.dataset.f==="v")S.bill.rows[+t.dataset.bi].v=t.value;
 else if(t.dataset&&t.dataset.sh!=null){var hh=S.cfg.hours.find(function(x){return String(x.day)===t.dataset.sh});if(hh){if(t.dataset.f==="open")hh.is_open=t.checked;else hh[t.dataset.f]=t.value}}
 else if(t.dataset&&t.dataset.af&&t.dataset.af!=="q"){S.af[t.dataset.af]=t.value;render()}});
setInterval(function(){if(S.user&&S.role&&S.role!=="customer"&&S.view==="orders"&&!document.hidden){loadOrders().then(render)}},20000);
render();whoami();
</script></body></html>
